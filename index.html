<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>любиш, не любиш ❤️</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:monospace}body{min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#22254d 0%,#11152f 45%,#080b24 100%);color:#f8d7ed;display:flex;align-items:center;justify-content:center;overflow:hidden}.container{position:relative;z-index:1;text-align:center;width:min(94vw,500px);padding:22px 18px 28px}.title{font-size:clamp(17px,4.5vw,25px);letter-spacing:2px;color:#ffd4ee;text-shadow:0 0 12px #ff83c3;margin:0 0 8px}.subtitle{font-size:12px;color:#a9b1ed;letter-spacing:1px;margin-bottom:18px}canvas{display:block;width:270px;height:360px;max-width:78vw;margin:0 auto;image-rendering:pixelated;cursor:pointer;touch-action:manipulation}.message{min-height:27px;margin:8px 0;color:#ffb9dd;font-size:16px}.hint{font-size:11px;color:#929bd1;margin:0 0 17px}.game-button,.final-button{border:1px solid #ff9bcd;background:#271c43;color:#ffd9ee;font-family:inherit;font-size:12px;letter-spacing:1px;padding:12px 18px;cursor:pointer;box-shadow:0 0 12px #e66bb544;transition:.2s}.game-button:hover,.final-button:hover{background:#483060;transform:translateY(-1px);box-shadow:0 0 18px #e66bb588}.stars,.grass{position:fixed;inset:0;pointer-events:none}.star{position:absolute;width:2px;height:2px;background:#cdd4ff;opacity:.7;animation:twinkle 2.5s infinite alternate}.grass{top:auto;height:70px;opacity:.25;background:repeating-linear-gradient(80deg,transparent 0 10px,#5d8b78 10px 11px,transparent 11px 18px);mask-image:linear-gradient(to top,black,transparent)}@keyframes twinkle{to{opacity:.18;transform:scale(.7)}}.final-screen{position:fixed;inset:0;z-index:5;background:radial-gradient(ellipse at center,#31204e 0%,#15152f 55%,#080b24 100%);display:flex;align-items:center;justify-content:center;text-align:center;opacity:0;visibility:hidden;transition:opacity .65s,visibility .65s;overflow:hidden}.final-screen.show{opacity:1;visibility:visible}.final-content{position:relative;z-index:3;padding:24px;max-width:95vw}.final-title{font-size:clamp(27px,8vw,54px);font-weight:bold;letter-spacing:2px;color:#ffd4ee;text-shadow:0 0 18px #ff83c3;line-height:1.25}.final-title span{display:block;margin-top:10px;font-size:clamp(17px,5vw,29px);letter-spacing:3px}.big-heart{font-size:clamp(65px,18vw,105px);margin:24px 0;animation:heartBeat 1.15s infinite}.final-button{font-size:clamp(10px,3vw,13px);margin-top:10px}@keyframes heartBeat{0%,100%{transform:scale(1)}14%{transform:scale(1.12)}28%{transform:scale(1)}}.confetti,.floating-heart{position:absolute;pointer-events:none;z-index:1}.confetti{width:7px;height:11px;animation:fall linear forwards}.floating-heart{font-size:16px;animation:floatUp linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}@keyframes floatUp{to{transform:translateY(-105vh) translateX(var(--drift));opacity:0}}@media(max-height:650px){.container{padding:10px}.title{margin-bottom:4px}.subtitle{margin-bottom:8px}canvas{width:210px;height:280px}.message{margin:3px 0}.hint{margin-bottom:8px}.big-heart{margin:12px 0}}
</style>
</head>
<body>
<div class="stars" id="stars"></div><div class="grass"></div>
<div class="container" id="game">
<h1 class="title">любиш, нелюбиш</h1><div class="subtitle">не симс(</div>
<canvas id="flower" width="180" height="240" aria-label="Нажимика"></canvas>
<div class="message" id="message">Нажмикабычтр 🌸</div><div class="hint" id="hint">епт</div>
<button class="game-button" onclick="restart()">START AGAIN</button>
</div>
<div class="final-screen" id="finalScreen"><div class="final-content"><div class="final-title">С ПРАЗДНИКОМ<span>И Т.Д.</span></div><div class="big-heart">❤️</div><button class="final-button" onclick="backToFlower()">ВЕРНУТЬСЯ В ИГРУ</button></div></div>
<script>
const canvas=document.getElementById('flower'),ctx=canvas.getContext('2d'),message=document.getElementById('message'),hint=document.getElementById('hint'),finalScreen=document.getElementById('finalScreen');
const W=canvas.width,H=canvas.height,CX=90,CY=88,petalCount=12;let removed=0,petals=[],falling=null,particles=[],celebrationStarted=false;
for(let i=0;i<95;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=Math.random()*3+'s';document.getElementById('stars').appendChild(s)}
function createPetals(){petals=[];for(let i=0;i<petalCount;i++){let a=(Math.PI*2*i/petalCount)-Math.PI/2;petals.push({a,removed:false})}}
function drawBackground(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#11152d';ctx.fillRect(0,0,W,H);for(let i=0;i<30;i++){let x=(i*37)%W,y=(i*61)%H;ctx.fillStyle=i%3===0?'#434c80':'#252d58';ctx.fillRect(x,y,1,1)}}
function drawStem(){ctx.fillStyle='#3c9a6c';ctx.fillRect(88,105,4,102);ctx.fillRect(80,145,10,3);ctx.fillRect(76,141,5,3);ctx.fillRect(78,138,4,3);ctx.fillRect(92,165,8,3);ctx.fillRect(98,162,5,3);ctx.fillRect(95,158,4,3)}
function drawPetal(p){if(p.removed)return;ctx.save();ctx.translate(CX,CY);ctx.rotate(p.a);ctx.fillStyle='#ff8fc5';ctx.fillRect(-5,-42,10,8);ctx.fillRect(-8,-34,16,18);ctx.fillRect(-10,-20,20,10);ctx.fillStyle='#ffc3e2';ctx.fillRect(-5,-39,4,12);ctx.restore()}
function drawCenter(){ctx.fillStyle='#f8d66d';ctx.fillRect(CX-9,CY-9,18,18);ctx.fillStyle='#e9aa46';ctx.fillRect(CX-5,CY-5,3,3);ctx.fillRect(CX+3,CY+2,3,3);ctx.fillRect(CX+1,CY-4,3,3);ctx.fillRect(CX-4,CY+3,3,3)}
function drawFlower(){drawBackground();drawStem();petals.forEach(drawPetal);if(falling){ctx.save();ctx.translate(falling.x,falling.y);ctx.rotate(falling.rot);ctx.fillStyle='#ff8fc5';ctx.fillRect(-7,-12,14,22);ctx.fillStyle='#ffc3e2';ctx.fillRect(-3,-9,4,12);ctx.restore()}drawCenter()}
function createParticles(x,y){for(let i=0;i<12;i++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:-Math.random()*3-1,life:30,color:['#ff92c7','#ffd4ee','#f8d66d'][i%3]})}
function animateParticles(){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.life--;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,3)});particles=particles.filter(p=>p.life>0)}
function animate(){drawFlower();animateParticles();if(falling){falling.y+=3.8;falling.x+=falling.vx;falling.rot+=.08;if(falling.y>H+20)falling=null}requestAnimationFrame(animate)}
canvas.addEventListener('click',e=>{if(falling||removed>=petalCount)return;const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)*W/rect.width,y=(e.clientY-rect.top)*H/rect.height;let idx=-1,best=999;petals.forEach((p,i)=>{if(p.removed)return;let px=CX+Math.cos(p.a)*27,py=CY+Math.sin(p.a)*27,dist=Math.hypot(x-px,y-py);if(dist<best){best=dist;idx=i}});if(idx<0||best>28)return;let p=petals[idx];p.removed=true;removed++;falling={x:CX+Math.cos(p.a)*30,y:CY+Math.sin(p.a)*30,rot:0,vx:(Math.random()-.5)*2};createParticles(falling.x,falling.y);let love=removed===petalCount||removed%2===1;message.textContent=love?'Loves me ❤️':'Loves me not 💔';hint.textContent=removed<petalCount?`${petalCount-removed} лепестков осталось`:'Результат получен!';if(removed===petalCount)setTimeout(showFinalScreen,1000)});
function restart(){removed=0;falling=null;particles=[];celebrationStarted=false;createPetals();message.textContent='Нажми на лепесток 🌸';hint.textContent='И узнаем, любит ли она тебя...';finalScreen.classList.remove('show');drawFlower()}
function showFinalScreen(){finalScreen.classList.add('show');createConfetti(150);createHearts(35)}
function createConfetti(n){for(let i=0;i<n;i++){const el=document.createElement('div');el.className='confetti';el.style.left=Math.random()*100+'vw';el.style.top=(-Math.random()*40)+'vh';el.style.background=['#ff8fc5','#f8d66d','#a8c5ff','#b4f0c2','#fff'][i%5];el.style.animationDuration=(3+Math.random()*5)+'s';el.style.animationDelay=Math.random()*2+'s';el.style.transform=`rotate(${Math.random()*360}deg)`;finalScreen.appendChild(el)}}
function createHearts(n){for(let i=0;i<n;i++){const el=document.createElement('div');el.className='floating-heart';el.textContent=['❤️','💗','💕','💖'][i%4];el.style.left=Math.random()*100+'vw';el.style.bottom=(-20-Math.random()*30)+'px';el.style.setProperty('--drift',(Math.random()*100-50)+'px');el.style.animationDuration=(4+Math.random()*5)+'s';el.style.animationDelay=Math.random()*3+'s';finalScreen.appendChild(el)}}
function backToFlower(){finalScreen.classList.remove('show');setTimeout(()=>{finalScreen.querySelectorAll('.confetti,.floating-heart').forEach(el=>el.remove());restart()},800)}
createPetals();animate();
</script>
</body>
</html>
